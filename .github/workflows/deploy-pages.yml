name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Sync hospitals from Google Sheet
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy website
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate release data and scripts
        run: |
          node --check app.js
          python - <<'PY'
          import json
          from pathlib import Path

          records = json.loads(Path('data/hospitals.json').read_text(encoding='utf-8'))
          required = {'id', 'name', 'type', 'address', 'province', 'status', 'updatedAt'}
          if not isinstance(records, list) or not records:
              raise SystemExit('hospitals.json must be a non-empty array')
          active = [record for record in records if isinstance(record, dict) and record.get('status') == 'active']
          if not active or any(not required.issubset(record) for record in active):
              raise SystemExit('Active hospital records do not match the required schema')
          if any('geocode' in record for record in records if isinstance(record, dict)):
              raise SystemExit('Deprecated geocode data must not be published')
          print(f'Validated {len(active)} active hospital records.')
          PY

      - name: Assemble minimal public website
        run: |
          mkdir -p _site/assets _site/data
          cp index.html app.js style.css signs.html signs-en.html _site/
          cp -R assets/. _site/assets/
          cp data/hospitals.json _site/data/hospitals.json

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

